name: DSH host contracts

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dsh_version:
        description: 'Exact public @deepseek-ai/dsh version (leave empty for the baseline)'
        type: string
        required: false

permissions:
  contents: read

jobs:
  plugin:
    name: Plugin and package checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm test
      - run: npm run check
      - name: Verify package contents and extracted code
        shell: bash
        run: |
          pack_dir=$(mktemp -d "$RUNNER_TEMP/dsh-plugin-pack.XXXXXXXX")
          archive=$(npm pack --ignore-scripts --silent --pack-destination "$pack_dir")
          node scripts/verify-pack.js "$pack_dir/$archive"
          git diff --exit-code HEAD -- package.json

  host:
    name: Detached DSH ${{ matrix.dsh }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # A manual candidate is tested independently; nothing updates the support declaration.
        dsh: ${{ fromJSON(inputs.dsh_version && format('[{0}]', toJSON(inputs.dsh_version)) || '["0.2.2-rc.3", "0.2.2-rc.5"]') }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install exact official npm runtime and run host contracts
        shell: bash
        env:
          DSH_VERSION: ${{ matrix.dsh }}
          NPM_CONFIG_USERCONFIG: /dev/null
          NPM_CONFIG_GLOBALCONFIG: /dev/null
        run: |
          if [[ ! "$DSH_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo 'Expected an exact DSH version, not a tag, range, URL, or path.' >&2
            exit 1
          fi
          runtime_dir=$(mktemp -d "$RUNNER_TEMP/dsh-npm-runtime.XXXXXXXX")
          (
            cd "$runtime_dir"
            npm install --prefix "$runtime_dir" --registry=https://registry.npmjs.org \
              --ignore-scripts --no-audit --no-fund --no-package-lock "@deepseek-ai/dsh@$DSH_VERSION"
          )
          node scripts/verify-host-matrix.js "$runtime_dir/node_modules/@deepseek-ai/dsh/package.json" "$DSH_VERSION"
